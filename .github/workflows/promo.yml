name: Record promo video
# Records a phone-sized run-through of the live site. Run by hand from the Actions tab.
# The recording goes to the "promo" branch (kept out of main so the site stays small).
on: workflow_dispatch
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install playwright
          python -m playwright install --with-deps chromium
      - run: |
          python scripts/promo.py 2>err.txt || { echo "::error title=Promo failed::$(tail -c 900 err.txt | tr '\n' ' ')"; exit 1; }
      - name: Save to the promo branch
        run: |
          cd promo
          git init -q -b promo
          git config user.name "playlist-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw.mp4 steps.json
          git commit -q -m "Promo recording"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" promo
