name: Refresh playlist explorer

on:
  schedule:
    # Once a day, aimed at 3:07 UTC (4:07am UK in summer, 3:07am in winter).
    # GitHub often starts scheduled runs hours late; that's fine, it just runs
    # whenever it gets there. Don't add a time-of-day check here: a late start
    # would make it skip the day entirely.
    - cron: "7 3 * * *"
  workflow_dispatch:           # adds a "Run workflow" button for a manual refresh
  push:
    branches: [main]
    paths: ["site/**", "scripts/build.py", "data/tracks.json", "data/youtube_overrides.json"]

permissions:
  contents: write   # save new tags back to the repo
  models: read      # free GitHub Models access for tagging
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install headless browser
        if: github.event_name != 'push'
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Read the playlist
        if: github.event_name != 'push'
        run: python scripts/scrape.py

      - name: Tag new tracks
        if: github.event_name != 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/tag.py

      - name: Find new songs on YouTube
        if: github.event_name != 'push'
        continue-on-error: true      # a YouTube hiccup should never stop the daily refresh
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/youtube.py --mode official

      - name: Build page
        env:
          SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
        run: python scripts/build.py

      - name: Save data
        if: github.event_name != 'push'
        run: |
          # Commit only when the playlist changed. If nothing has been committed for
          # 40 days, write a timestamp so GitHub doesn't pause the schedule (it does
          # after 60 days without activity).
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt 3456000 ]; then date -u +"%Y-%m-%dT%H:%MZ" > data/last_checked.txt; fi
          git config user.name "playlist-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Refresh playlist data" || echo "Nothing new"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
